name: daily-capture

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 05:30 เวลาไทย (หลังตลาด US ปิด) อังคาร–เสาร์ตามเวลาไทย
  workflow_dispatch:           # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python capture.py
      - run: python report.py
      - name: Commit data
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add data report.html calendar.ics
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase --autostash
          git push
