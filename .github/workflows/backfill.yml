name: backfill

on:
  workflow_dispatch:   # กดรันเองครั้งเดียวจากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backfill.py
      - run: python capture.py
      - run: python report.py
      - name: Commit data
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add data report.html calendar.ics
          git diff --cached --quiet || git commit -m "backfill: $(date -u +%F)"
          git pull --rebase --autostash
          git push
